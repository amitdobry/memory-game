# Publish the workshop site to GitHub Pages.
#
# Pages can only serve a branch's root or its /docs folder, and this site lives in
# public/ — with docs/ already meaning something else. So rather than rearrange the
# repo to suit the host, this uploads public/ as the artifact and leaves the layout
# alone.
#
# There is no build step and nothing to install: the site is plain HTML, CSS and ES
# modules, and the repo has no runtime dependencies at all.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      # The same landing page is also served at https://amitdobry.github.io/workshop/ by
      # the amitdobry/workshop repository, whose workflow rebuilds it from this repo. That
      # workflow polls every 15 minutes on its own; with a token it can be told at once.
      # The token is optional: a fine-grained PAT for the workshop repository only, with
      # Contents: read and write, stored here as the secret WORKSHOP_PUBLISH_TOKEN. Without
      # it this step does nothing and the poll carries the update.
      - name: Tell amitdobry/workshop to publish now (only when a token is configured)
        env:
          TOKEN: ${{ secrets.WORKSHOP_PUBLISH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "no WORKSHOP_PUBLISH_TOKEN; the workshop repo will pick this up on its schedule"; exit 0; fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/amitdobry/workshop/dispatches \
            -d '{"event_type":"memory-game-updated"}'
          echo "dispatched"
